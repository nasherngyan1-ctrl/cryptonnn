name: Build Installable Android APK (OKX Kurd AI Pro)

on:
  push:
    branches: [ "main", "master", "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package OKX Kurd AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses (Built-in GitHub Runner SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Prepare Environment & Keystores
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x ./gradlew

      - name: Build Installable APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OKX-Kurd-AI-Pro.apk
          ls -lh dist/OKX-Kurd-AI-Pro.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKX-Kurd-AI-Pro-APK
          path: dist/OKX-Kurd-AI-Pro.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OKX Kurd AI Pro v1.0.${{ github.run_number }} (Installable APK)"
          body: |
            ### ئۆکەی ئێکس کورد AI پرۆ (OKX Kurd AI Pro)
            - فایلی دامەزراندنی ئەندرۆید (`OKX-Kurd-AI-Pro.apk`) ئامادەیە بۆ دابەزاندن و ئینستاڵکردن لەسەر مۆبایلەکەت.
            - پەیوەستە بە داتای زیندووی بازاڕی **OKX API v5** و زیرەکی دەستکردی **Gemini 3.8 Flash**.
          files: dist/OKX-Kurd-AI-Pro.apk
          prerelease: false
